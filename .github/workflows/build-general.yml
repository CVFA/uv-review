name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Ensure Python source file exists
        run: |
          if [ -f uv-review ]; then
            cp uv-review uv_review.py
          fi

          test -f uv_review.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-dev \
            python3-venv \
            python3-pip \
            ccache \
            patchelf

      - name: Compile with Nuitka
        run: |
          set -euo pipefail

          python3 -m venv .venv
          . .venv/bin/activate

          python -m pip install --upgrade pip
          pip install --upgrade nuitka textual

          python -m nuitka \
            --standalone \
            --onefile \
            --static-libpython=yes \
            --assume-yes-for-downloads \
            --enable-plugin=anti-bloat \
            --include-package=textual \
            --include-package-data=textual \
            --output-dir=dist \
            uv_review.py

      - name: Package artifact
        run: |
          mkdir -p artifacts
          cp dist/uv_review artifacts/uv-review-linux-x86_64
          chmod +x artifacts/uv-review-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: uv-review-linux-x86_64
          path: artifacts/uv-review-linux-x86_64
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Ensure Python source file exists
        run: |
          if [ -f uv-review ]; then
            cp uv-review uv_review.py
          fi

          test -f uv_review.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-dev \
            python3-venv \
            python3-pip \
            ccache \
            patchelf

      - name: Compile with Nuitka
        run: |
          set -euo pipefail

          python3 -m venv .venv
          . .venv/bin/activate

          python -m pip install --upgrade pip
          pip install --upgrade nuitka textual

          python -m nuitka \
            --standalone \
            --onefile \
            --static-libpython=yes \
            --assume-yes-for-downloads \
            --enable-plugin=anti-bloat \
            --include-package=textual \
            --include-package-data=textual \
            --output-dir=dist \
            uv_review.py

      - name: Package artifact
        run: |
          mkdir -p artifacts
          cp dist/uv_review artifacts/uv-review-linux-arm64
          chmod +x artifacts/uv-review-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: uv-review-linux-arm64
          path: artifacts/uv-review-linux-arm64
          if-no-files-found: error

  build-windows-x86_64:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Ensure Python source file exists
        shell: bash
        run: |
          if [ -f uv-review ]; then
            cp uv-review uv_review.py
          fi

          test -f uv_review.py

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade nuitka textual

      - name: Compile with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --static-libpython=auto \
            --assume-yes-for-downloads \
            --enable-plugin=anti-bloat \
            --include-package=textual \
            --include-package-data=textual \
            --output-dir=dist \
            uv_review.py

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp dist/uv_review.exe artifacts/uv-review-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: uv-review-windows-x86_64
          path: artifacts/uv-review-windows-x86_64.exe
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: macos-x86_64
          - os: macos-14
            target: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Ensure Python source file exists
        run: |
          if [ -f uv-review ]; then
            cp uv-review uv_review.py
          fi

          test -f uv_review.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade nuitka textual

      - name: Compile with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --static-libpython=auto \
            --assume-yes-for-downloads \
            --enable-plugin=anti-bloat \
            --include-package=textual \
            --include-package-data=textual \
            --output-dir=dist \
            uv_review.py

      - name: Package artifact
        run: |
          mkdir -p artifacts
          cp dist/uv_review artifacts/uv-review-${{ matrix.target }}
          chmod +x artifacts/uv-review-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: uv-review-${{ matrix.target }}
          path: artifacts/uv-review-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows-x86_64
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: uv-review-*
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum uv-review-* > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
